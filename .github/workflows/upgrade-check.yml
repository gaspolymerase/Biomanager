name: upgrade-check

# Every earlier release's database has to open in this version with nothing
# lost (scripts/upgrade-check.py, app/upgrade.py): a desktop app's SQLite,
# and a lab server's PostgreSQL. Runs on master and on release tags, where
# it matters; a release shouldn't go out if it fails.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          grep -v pywebview requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Upgrade every release's demo lab
        run: python scripts/upgrade-check.py

  upgrade-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: upgrade-check
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every release tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          grep -v pywebview requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Upgrade every release's lab server
        run: python scripts/upgrade-check.py --postgres postgresql://postgres:upgrade-check@localhost:5432/postgres
