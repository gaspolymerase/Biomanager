{# An error page that needs nothing from the database (it may be the
   database that failed): no sidebar, no account menu. #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ title }} · BioManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">
  </head>
  <body>
    <article class="card mx-auto mt-6 max-w-[520px] p-6">
      <h1 class="text-[17px]">{{ title }}</h1>
      <p class="mt-2 text-[13px] leading-snug text-muted">{{ message }}</p>
      <div class="mt-5 flex flex-wrap gap-2">
        {% if request.referrer and request.referrer.startswith(request.host_url) %}
          <a class="btn btn-primary" href="{{ request.referrer }}">Back</a>
        {% endif %}
        <a class="btn" href="/">Go home</a>
      </div>
    </article>
  </body>
</html>
