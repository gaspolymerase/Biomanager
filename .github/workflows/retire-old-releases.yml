name: retire-old-releases

# Releases before 0.10.1 carried a maintainer's own details in their app
# files. Once 0.10.1 is published in both repositories, this deletes every
# older release: here the release and its files only (the git tags stay,
# for scripts/upgrade-check.py), and on biomanager-app the release and its
# tag. Runs when this file changes, and by hand; with nothing older left it
# does nothing.

on:
  push:
    paths: [".github/workflows/retire-old-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEEP: v0.10.1
  OLD_REPO: gaspolymerase/biomanager-app

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the releases older than ${{ env.KEEP }}
        env:
          HERE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          retire() {   # repo, token, extra flags for gh release delete
            local repo=$1 token=$2; shift 2
            if [ "$(GH_TOKEN=$token gh release view "$KEEP" --repo "$repo" --json isDraft --jq .isDraft)" != "false" ]; then
              echo "::error::$repo has no published $KEEP yet: nothing deleted"; exit 1
            fi
            for tag in $(GH_TOKEN=$token gh release list --repo "$repo" --limit 100 --json tagName --jq '.[].tagName'); do
              [ "$tag" = "$KEEP" ] && continue
              GH_TOKEN=$token gh release delete "$tag" --repo "$repo" --yes "$@"
              echo "$repo: $tag deleted"
            done
          }
          retire "$GITHUB_REPOSITORY" "$HERE_TOKEN"
          retire "$OLD_REPO" "$OLD_TOKEN" --cleanup-tag
      - name: What is left
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY"
          GH_TOKEN=$OLD_TOKEN gh release list --repo "$OLD_REPO"
