name: rebundle-old-releases

# The server bundles published up to 0.10.0 carried our own server's runbook
# (now docs/OUR-SERVER.md). This puts the generic deploy/RUNBOOK.md into each
# published bundle that still names our server or us, and replaces that release's
# biomanager-server.tar.gz. Nothing else in a bundle changes, and a bundle
# that names no server is left alone, so running it again does nothing.
# Runs when this file changes, and by hand.

on:
  push:
    paths: [".github/workflows/rebundle-old-releases.yml"]
  workflow_dispatch:

env:
  PUBLIC_REPO: gaspolymerase/biomanager-app

jobs:
  rebundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the runbook in each bundle that names our server
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::No PUBLIC_RELEASE_TOKEN secret."; exit 1; }
          mkdir -p work && cd work
          for tag in $(gh release list --repo "$PUBLIC_REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            if ! gh release download "$tag" --repo "$PUBLIC_REPO" --pattern biomanager-server.tar.gz --output "$tag.tar.gz" 2>/dev/null; then
              echo "$tag: no server bundle"; continue
            fi
            if ! tar -xzOf "$tag.tar.gz" | grep -qiE 'tail1234|\bbiomanager-vm\b|biomanager_key|alex|barbara|\blab member\b|\bmcclintock lab\b|52350568'; then
              echo "$tag: names no server, left as it is"; continue
            fi
            mkdir -p "$tag"
            python3 ../.github/rebundle-runbook.py "$tag.tar.gz" "$tag/biomanager-server.tar.gz"
            # The same VERSION as before (the oldest bundles have none).
            [ "$(tar -xzOf "$tag/biomanager-server.tar.gz" Biomanager/deploy/VERSION 2>/dev/null)" = "$(tar -xzOf "$tag.tar.gz" Biomanager/deploy/VERSION 2>/dev/null)" ]
            gh release upload "$tag" "$tag/biomanager-server.tar.gz" --repo "$PUBLIC_REPO" --clobber
            echo "$tag: replaced"
          done
      - name: Check every published bundle, as anyone downloads it
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          mkdir -p check && cd check
          bad=0
          for tag in $(gh release list --repo "$PUBLIC_REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            curl -fsSL -o b.tar.gz "https://github.com/$PUBLIC_REPO/releases/download/$tag/biomanager-server.tar.gz" || { echo "$tag: no server bundle"; continue; }
            if tar -xzOf b.tar.gz | grep -qiE 'tail1234|\bbiomanager-vm\b|biomanager_key|alex|barbara|\blab member\b|\bmcclintock lab\b|52350568'; then
              echo "::error::$tag: the published bundle still names our server or us"; bad=1
            else
              echo "$tag: clean"
            fi
          done
          exit $bad
