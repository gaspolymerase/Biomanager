<?xml version="1.0" encoding="UTF-8"?>
<!--
  BioManager app icon.

  Laid out on Apple's macOS icon grid: a 1024 canvas with the rounded
  square inset to 824×824 and a 185.4 corner radius, so it sits correctly
  next to native apps in the Dock rather than looking oversized.

  The mark is a double helix — the one symbol every organism in this app
  shares, and the only one that stays legible at 16px in a browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ED0B2"/>
      <stop offset="0.52" stop-color="#17A38F"/>
      <stop offset="1" stop-color="#0B7268"/>
    </linearGradient>

    <!-- Light catching the top edge, the way Apple's icons are lit. -->
    <linearGradient id="bm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bm-strand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E4FFF8"/>
    </linearGradient>

    <filter id="bm-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#052E2A" flood-opacity="0.28"/>
    </filter>

    <clipPath id="bm-clip">
      <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"/>
    </clipPath>
  </defs>

  <g filter="url(#bm-drop)">
    <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="url(#bm-bg)"/>
  </g>

  <g clip-path="url(#bm-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bm-sheen)"/>
    <!-- A soft glow behind the mark so the white lifts off the ground. -->
    <ellipse cx="512" cy="470" rx="300" ry="260" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- Double helix. Rungs sit behind the strands so the crossings read. -->
  <g stroke="#ffffff" stroke-opacity="0.82" stroke-width="26" stroke-linecap="round">
    <line x1="405" y1="330" x2="619" y2="330"/>
    <line x1="437" y1="408" x2="587" y2="408"/>
    <line x1="437" y1="616" x2="587" y2="616"/>
    <line x1="405" y1="694" x2="619" y2="694"/>
  </g>

  <g fill="none" stroke="url(#bm-strand)" stroke-width="54" stroke-linecap="round">
    <path d="M405 268C405 352 619 352 619 436C619 520 405 520 405 604C405 688 619 688 619 772"/>
    <path d="M619 268C619 352 405 352 405 436C405 520 619 520 619 604C619 688 405 688 405 772"/>
  </g>

  <!-- Inner edge highlight, which is what makes an Apple icon look pressed
       rather than pasted on. -->
  <rect x="103" y="103" width="818" height="818" rx="183" ry="183"
        fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
