{% extends "base.html" %}

{% block page_title %}{{ _('Guest access') }}{% endblock %}

{% block content %}
<article class="card p-6">
  <h1 class="text-[17px]">{{ _('Guest access') }}</h1>
  <p class="mt-1 text-[12.5px] leading-snug text-muted">
    {{ _('Enter the code the lab gave you. It signs you in for as long as your access lasts.') }}
  </p>
  <form method="post" class="mt-5 flex flex-col gap-3">
    <label class="field-label">{{ _('Code') }}
      <input name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus
             class="font-mono tracking-wider" placeholder="XXXX-XXXX-XXXX-XXXX">
    </label>
    <button type="submit" class="btn btn-primary btn-lg mt-1 w-full">{{ _('Continue') }}</button>
  </form>
</article>
{% endblock %}
