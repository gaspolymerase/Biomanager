name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A lab server runs on PostgreSQL, a laptop or the desktop app on
        # SQLite; the same suite has to pass on both.
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biomanager
          POSTGRES_PASSWORD: biomanager
          POSTGRES_DB: biomanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biomanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BIOMANAGER_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://biomanager:biomanager@localhost:5432/biomanager_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # pywebview is only for the desktop build and needs GUI libraries
        # that the Linux runner does not have; the tests never import it.
        run: |
          grep -v pywebview requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -t .
